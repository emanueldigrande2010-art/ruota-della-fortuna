<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruota della Fortuna Interattiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap');
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between selection:bg-pink-500 selection:text-white">

  <!-- Header -->
  <header class="py-6 text-center border-b border-slate-800 bg-slate-950/50 backdrop-blur-md sticky top-0 z-20">
    <h1 class="text-3xl md:text-5xl font-black bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 bg-clip-text text-transparent tracking-tight">
      RUOTA DELLA FORTUNA
    </h1>
    <p class="text-slate-400 text-sm md:text-base mt-1 font-medium">Gira la ruota e scopri cosa esce!</p>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-8 flex flex-col lg:flex-row items-center lg:items-start justify-center gap-8 lg:gap-12">
    
    <!-- Sezione Ruota (Sinistra) -->
    <div class="flex-1 flex flex-col items-center justify-center w-full max-w-[650px]">
      <div class="relative w-full aspect-square max-w-[600px] flex items-center justify-center p-2">
        <!-- Freccia / Indicatore (Punta verso la ruota) -->
        <div class="absolute -top-3 z-10 w-0 h-0 border-l-[18px] border-l-transparent border-r-[18px] border-r-transparent border-t-[36px] border-t-pink-500 drop-shadow-[0_4px_10px_rgba(236,72,153,0.8)]"></div>
        
        <!-- Canvas Ruota -->
        <canvas id="wheelCanvas" width="600" height="600" class="w-full h-full drop-shadow-[0_0_35px_rgba(99,102,241,0.25)] transition-transform duration-75"></canvas>
      </div>

      <!-- Pulsante Gira -->
      <button id="spinBtn" class="mt-6 w-full max-w-md py-4 px-8 bg-gradient-to-r from-pink-500 to-indigo-600 hover:from-pink-600 hover:to-indigo-700 active:scale-95 text-white font-extrabold text-xl md:text-2xl rounded-2xl shadow-lg shadow-indigo-500/30 transition-all duration-200 border border-white/10 flex items-center justify-center gap-3">
        <span>GIRA LA RUOTA!</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 animate-bounce" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>

    <!-- Sezione Pannello di Controllo (Destra) -->
    <div class="w-full lg:w-[420px] bg-slate-800/60 backdrop-blur-xl border border-slate-700/60 rounded-3xl p-6 shadow-2xl flex flex-col gap-6">
      <div class="flex items-center justify-between border-b border-slate-700/60 pb-4">
        <h2 class="text-xl font-bold text-slate-100 flex items-center gap-2">
          <span>Opzioni</span>
          <span id="itemCount" class="text-xs bg-indigo-500/20 text-indigo-300 font-semibold px-2.5 py-1 rounded-full border border-indigo-500/30">0</span>
        </h2>
        <div class="flex gap-2">
          <button id="soundToggleBtn" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-300 transition flex items-center gap-1.5 border border-slate-600">
            <span id="soundIcon">🔊</span> <span id="soundText">Audio ON</span>
          </button>
          <button id="resetBtn" class="text-xs bg-slate-700/50 hover:bg-red-500/20 hover:text-red-300 text-slate-400 px-3 py-1.5 rounded-lg transition border border-slate-700">
            Reset
          </button>
        </div>
      </div>

      <!-- Input Aggiungi Opzione -->
      <form id="addForm" class="flex gap-2">
        <input type="text" id="itemInput" placeholder="Aggiungi qualcosa..." maxlength="30" class="flex-1 bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-5 py-3 rounded-xl transition active:scale-95 flex items-center justify-center">
          +
        </button>
      </form>

      <!-- Lista Opzioni -->
      <div id="itemList" class="flex-1 max-h-[350px] overflow-y-auto space-y-2 pr-1 custom-scrollbar"></div>
    </div>
  </main>

  <!-- Modale Risultato -->
  <div id="resultModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-700 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl transform scale-95 transition-transform duration-300 flex flex-col items-center">
      <div class="text-5xl mb-3">🎉</div>
      <h3 class="text-sm font-semibold text-pink-400 tracking-wider uppercase mb-1">È uscito:</h3>
      <p id="winnerResult" class="text-3xl font-black text-white my-3 break-words max-w-full"></p>
      <button id="closeModalBtn" class="mt-6 w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition shadow-lg shadow-indigo-500/25">
        Ottimo!
      </button>
    </div>
  </div>

  <script>
    // Dati e Variabili di Stato
    let items = ["Pizza", "Hamburger", "Sushi", "Gelato", "Tacos", "Pasta"];
    const colors = [
      '#ec4899', '#8b5cf6', '#6366f1', '#3b82f6', 
      '#06b6d4', '#10b981', '#f59e0b', '#ef4444'
    ];
    
    let currentAngle = 0;
    let isSpinning = false;
    let soundEnabled = true;

    // Elementi DOM
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const spinBtn = document.getElementById('spinBtn');
    const itemInput = document.getElementById('itemInput');
    const addForm = document.getElementById('addForm');
    const itemList = document.getElementById('itemList');
    const itemCount = document.getElementById('itemCount');
    const resetBtn = document.getElementById('resetBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const soundText = document.getElementById('soundText');
    const resultModal = document.getElementById('resultModal');
    const winnerResult = document.getElementById('winnerResult');
    const closeModalBtn = document.getElementById('closeModalBtn');

    // Synthesis Audio (Web Audio API)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    // Suono del ticchettio (Click)
    function playTickSound() {
      if (!soundEnabled) return;
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
      
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    // Suono di vittoria (Fanfara)
    function playWinSound() {
      if (!soundEnabled) return;
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const notes = [261.63, 329.63, 392.00, 523.25]; // C4, E4, G4, C5
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        const startTime = audioCtx.currentTime + (index * 0.1);
        const duration = index === notes.length - 1 ? 0.4 : 0.12;

        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration);
      });
    }

    // Gestione Mute / Unmute
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundIcon.textContent = soundEnabled ? '🔊' : '🔇';
      soundText.textContent = soundEnabled ? 'Audio ON' : 'Audio OFF';
      soundToggleBtn.classList.toggle('opacity-50', !soundEnabled);
    });

    // Disegno della ruota
    function drawWheel() {
      const numOptions = items.length;
      const center = canvas.width / 2;
      const radius = center - 10;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (numOptions === 0) {
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 8;
        ctx.stroke();
        
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 24px Poppins';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Aggiungi opzioni!', center, center);
        return;
      }

      const sliceAngle = (2 * Math.PI) / numOptions;

      items.forEach((item, index) => {
        const startAngle = currentAngle + index * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        // Fetta
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();
        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Testo
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Poppins';
        ctx.shadowColor = 'rgba(0,0,0,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillText(item, radius - 35, 0);
        ctx.restore();
      });

      // Cerchio centrale
      ctx.beginPath();
      ctx.arc(center, center, 45, 0, 2 * Math.PI);
      ctx.fillStyle = '#0f172a';
      ctx.fill();
      ctx.strokeStyle = '#ec4899';
      ctx.lineWidth = 5;
      ctx.stroke();
    }

    // Rotazione con animazione fisica e suoni
    function spin() {
      if (isSpinning || items.length === 0) return;
      isSpinning = true;
      spinBtn.disabled = true;
      spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

      const numOptions = items.length;
      const sliceAngle = (2 * Math.PI) / numOptions;

      const randomRounds = 5 + Math.random() * 4; // Da 5 a 9 giri
      const totalRotation = randomRounds * 2 * Math.PI + Math.random() * 2 * Math.PI;

      const duration = 4500;
      const startTime = performance.now();
      const initialAngle = currentAngle;

      let lastSliceIndex = -1;

      function animate(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Easing out cubic
        const easeOut = 1 - Math.pow(1 - progress, 3);
        currentAngle = initialAngle + totalRotation * easeOut;

        // Calcola in che fetta si trova la freccia per il suono del ticchettio
        const normalizedAngle = (currentAngle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
        const pointerAngle = (3 * Math.PI / 2 - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
        const currentSliceIndex = Math.floor(pointerAngle / sliceAngle);

        if (currentSliceIndex !== lastSliceIndex) {
          playTickSound();
          lastSliceIndex = currentSliceIndex;
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          spinBtn.disabled = false;
          spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

          // Calcola vincitore finale
          const winnerIndex = currentSliceIndex;
          showResult(items[winnerIndex]);
        }
      }

      requestAnimationFrame(animate);
    }

    // Risultato e Coriandoli
    function showResult(winner) {
      winnerResult.textContent = winner;
      resultModal.classList.remove('hidden', 'opacity-0');
      resultModal.classList.add('flex', 'opacity-100');

      playWinSound();

      confetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    closeModalBtn.addEventListener('click', () => {
      resultModal.classList.add('opacity-0');
      setTimeout(() => {
        resultModal.classList.add('hidden');
        resultModal.classList.remove('flex');
      }, 300);
    });

    // Gestione Lista
    function updateUI() {
      itemCount.textContent = items.length;
      itemList.innerHTML = '';
      
      items.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between bg-slate-900/60 border border-slate-700/50 rounded-xl px-4 py-2.5 transition hover:border-slate-600';
        div.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full" style="background-color: ${colors[index % colors.length]}"></span>
            <span class="font-medium text-slate-200 text-sm">${item}</span>
          </div>
          <button onclick="removeItem(${index})" class="text-slate-500 hover:text-red-400 p-1 transition">
            ✕
          </button>
        `;
        itemList.appendChild(div);
      });

      drawWheel();
    }

    addForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = itemInput.value.trim();
      if (val) {
        items.push(val);
        itemInput.value = '';
        updateUI();
      }
    });

    window.removeItem = function(index) {
      if (isSpinning) return;
      items.splice(index, 1);
      updateUI();
    };

    resetBtn.addEventListener('click', () => {
      if (isSpinning) return;
      items = ["Pizza", "Hamburger", "Sushi", "Gelato", "Tacos", "Pasta"];
      updateUI();
    });

    spinBtn.addEventListener('click', spin);

    // Inizializzazione
    updateUI();
  </script>
</body>
</html>
